# Danh sách bài phân tích. Trang chủ, thư viện /phan-tich/ và trang từng bài đọc số từ đây:
# đổi một chỗ ở đây là đổi cả ba nơi. Bài mới nhất (theo `ngay`) đứng đầu.
#
# - Số tiền ghi bằng đồng, KHÔNG có dấu chấm ngăn nghìn: 26694, không phải 26.694.
# - Ngày ghi dạng năm-tháng-ngày: 2026-10-15.
# - Gõ sai kiểu (chữ vào chỗ số, thiếu mục bắt buộc) thì `npm run build` báo lỗi và không lên web.

- id: pow
