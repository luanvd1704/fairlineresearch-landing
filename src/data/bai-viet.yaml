  ten: Tổng công ty Điện lực Dầu khí Việt Nam (PV Power)
  san: HOSE
  nganh: Điện
  danhMuc: Điện và năng lượng
  tieuDe: "PV Power: lãi 2026 cao một phần nhờ khoản một lần, Nhơn Trạch 3-4 là ván cược lớn nhất"
  ngay: 2026-11-06
  soLieuDen: Q3/2026
  taiLieu: Dashboard, định giá
  # Thẻ bài: trang chủ dùng `tomTat`, thư viện dùng `tomTatThuVien`; câu định giá tự nối thêm vào cuối
