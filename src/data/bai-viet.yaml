# Danh sách bài phân tích. Trang chủ, thư viện /phan-tich/ và trang từng bài đọc số từ đây:
# đổi một chỗ ở đây là đổi cả ba nơi. Bài mới nhất (theo `ngay`) đứng đầu.
#
# - Số tiền ghi bằng đồng, KHÔNG có dấu chấm ngăn nghìn: 26694, không phải 26.694.
# - Ngày ghi dạng năm-tháng-ngày: 2026-10-15.
# - Gõ sai kiểu (chữ vào chỗ số, thiếu mục bắt buộc) thì `npm run build` báo lỗi và không lên web.

- id: mcm
  ma: MCM
  ten: Giống bò sữa Mộc Châu
  san: UPCoM
  nganh: Sữa
  danhMuc: Sữa và thực phẩm
  tieuDe: "Mộc Châu Milk: kinh doanh sữa co lại, tiền gửi gánh gần nửa giá trị"
  ngay: 2026-10-15
  soLieuDen: Q2/2026
  taiLieu: Dashboard, định giá, Excel
  # Thẻ bài: trang chủ dùng `tomTat`, thư viện dùng `tomTatThuVien`; câu định giá tự nối thêm vào cuối
  tomTat: "Lợi nhuận lõi giảm từ 289 tỷ (2022) còn 152 tỷ (2025); lãi tiền gửi bằng 42% LNTT."
