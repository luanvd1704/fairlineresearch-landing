    cot: [38, 62, 48, 80, 56] # chiều cao (%) các cột trang trí trên ảnh bìa; thư viện dùng 4 cột đầu
  dinhGia:
    giaThamChieu: 26600
    ngayGia: 2026-10-13
    bienAnToan: 0.6 # %, lấy nguyên từ file Excel
    # Phương pháp có `dung: true` là con số dùng (giá trị hợp lý = kịch bản cơ sở); các dòng khác chỉ để đối chiếu
    phuongPhap:
