  tomTatThuVien: "9 tháng 2026 LNTT 7.744 tỷ, trong đó khoảng 2.476 tỷ là khoản hồi tố ghi trong quý 2; bỏ khoản một lần, LNTT quý 3 khoảng 1.900 tỷ. Nhơn Trạch 3-4 vốn ước 29.000 tỷ, giá trị theo dòng tiền khoảng 17.600 tỷ. Phải thu khách hàng 23.964 tỷ, gần hết là EVN; không trả cổ tức tiền từ 11/2021."
